[project]
name = "b3-explained-chart"
version = "1.0.0"
description = "Charts of B3 stocks where an LLM explains the days with strong moves, citing the news."
requires-python = ">=3.13"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "D"]
ignore = ["D105", "D107", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/explain.py" = ["E501", "D101"]
"src/translate.py" = ["E501", "D101"]
