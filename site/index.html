<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B3 Moves, Explained</title>
  <meta name="description" content="Os dias de movimento forte de cinco ações da B3 nos últimos 12 meses, com o motivo de cada um segundo as notícias.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    /**
     * Sets <html lang> before first paint, so the wrong language never flashes.
     * Priority: ?lang= in the URL, then the saved choice, then the browser language.
     */
    (function pickInitialLanguage() {
      const supported = ["pt", "en"];
      const fromUrl = new URLSearchParams(location.search).get("lang");
      const saved = localStorage.getItem("lang");
      const fromBrowser = (navigator.language || "").toLowerCase().startsWith("pt") ? "pt" : "en";
      const lang = [fromUrl, saved].find((choice) => supported.includes(choice)) || fromBrowser;
      document.documentElement.lang = lang === "en" ? "en" : "pt-BR";
    })();
  </script>
</head>
<body>
  <header class="band masthead">
    <div class="wrap masthead-row">
      <div>
        <p class="brand">B3 Moves, Explained</p>
        <p class="tagline" data-i18n="tagline">Os dias de movimento forte de cinco ações da B3, com o motivo de cada um segundo as notícias.</p>
      </div>
      <div class="controls">
        <nav class="tabs" id="tickers" aria-label="Escolha a ação"></nav>
        <div class="lang" role="group" aria-label="Idioma / Language">
          <button type="button" data-lang="pt" lang="pt-BR">PT</button>
          <button type="button" data-lang="en" lang="en">EN</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="band plate">
      <div class="wrap">
        <h1 id="finding" data-i18n="loading">Carregando…</h1>
        <dl class="figures" id="figures"></dl>

        <div class="plate-grid">
          <figure class="chart-block">
            <div class="chart-box">
              <div id="chart" class="chart" role="img"></div>
              <div id="pins" class="pins"></div>
              <div id="callout" class="callout" hidden><div class="callout-box"></div><div class="leader"></div></div>
              <div id="tooltip" class="tooltip" hidden></div>
            </div>
            <figcaption class="legend" id="legend"></figcaption>
          </figure>

          <aside class="detail" id="detail" aria-live="polite"></aside>
        </div>
      </div>
    </section>

    <section class="band">
      <div class="wrap">
        <h2 id="events-title"></h2>
        <div class="scroll">
          <table class="events stack" id="events">
            <thead><tr id="events-head"></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="band method" id="eval">
      <div class="wrap">
        <h2 id="eval-title"></h2>
        <dl class="figures" id="eval-figures"></dl>
        <div class="cols">
          <div><h3 data-i18n="m1h"></h3><p data-i18n="m1p"></p></div>
          <div><h3 data-i18n="m2h"></h3><p id="m2p"></p></div>
          <div><h3 data-i18n="m3h"></h3><p id="m3p"></p></div>
        </div>
        <p class="limits" data-i18n="limits"></p>
      </div>
    </section>
  </main>

  <footer class="band foot">
    <div class="wrap"><p id="footer"></p></div>
  </footer>

  <script src="https://unpkg.com/lightweight-charts@5.0.9/dist/lightweight-charts.standalone.production.js"></script>
  <script src="app.js"></script>
</body>
</html>
